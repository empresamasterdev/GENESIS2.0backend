services:
  - type: web
    name: viltrix-ai-lab-backend
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: GROQ_IA1_API_KEY
        sync: false
      - key: GROQ_IA2_API_KEY
        sync: false
      - key: GROQ_IA3_API_KEY
        sync: false
      - key: GROQ_IA4_API_KEY
        sync: false
      - key: MISTRAL_IA5_API_KEY
        sync: false
      - key: MISTRAL_IA6_API_KEY
        sync: false
      - key: GROQ_IA1_MODEL
        value: openai/gpt-oss-120b
      - key: GROQ_IA2_MODEL
        value: openai/gpt-oss-120b
      - key: GROQ_IA3_MODEL
        value: openai/gpt-oss-120b
      - key: GROQ_IA4_MODEL
        value: openai/gpt-oss-120b
      - key: MISTRAL_IA5_MODEL
        value: mistral-small-2603
      - key: MISTRAL_IA6_MODEL
        value: mistral-small-2603
      - key: CORS_ORIGIN
        value: "*"
